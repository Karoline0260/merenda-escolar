  </div>

  <script>


    /**
     * ========================================================
     * OBTER TOKEN DA GESTÃO
     * ========================================================
     */
    function obterTokenGestao() {

      var token =
        String(
          sessionStorage.getItem(
            "token"
          ) || ""
        ).trim();


      var perfil =
        String(
          sessionStorage.getItem(
            "perfil"
          ) || ""
        )
        .trim()
        .toUpperCase();


      if (
        !token ||
        perfil !== "GESTAO"
      ) {

        encerrarSessaoLocal();

        return "";
      }


      return token;
    }


    /**
     * ========================================================
     * INICIALIZAR GESTÃO
     * ========================================================
     */
    function inicializarGestao() {

      var token =
        obterTokenGestao();


      if (!token) {
        return;
      }


      google.script.run

        .withSuccessHandler(
          function(resultado) {

            if (
              !resultado ||
              !resultado.autenticado ||
              !resultado.usuario
            ) {

              encerrarSessaoLocal();

              return;
            }


            var perfil =
              String(
                resultado.usuario.perfil ||
                ""
              )
              .trim()
              .toUpperCase();


            if (
              perfil !== "GESTAO"
            ) {

              encerrarSessaoLocal();

              return;
            }


            sessionStorage.setItem(
              "perfil",
              perfil
            );


            sessionStorage.setItem(
              "nome",
              resultado.usuario.nome ||
              "Gestão"
            );


            document
              .getElementById(
                "nomeGestao"
              )
              .textContent =
                "Olá, " +
                (
                  resultado.usuario.nome ||
                  "Gestão"
                ) +
                "!";


            carregarProdutos();

            carregarRefeicoesCalendario();

            carregarCalendario();
          }
        )

        .withFailureHandler(
          function() {

            encerrarSessaoLocal();
          }
        )

        .consultarSessao(
          token
        );
    }


    /**
     * ========================================================
     * CARREGAR REFEIÇÕES CADASTRADAS
     * ========================================================
     */
    function carregarProdutos() {

      var lista =
        document.getElementById(
          "listaProdutos"
        );


      var token =
        obterTokenGestao();


      if (!token) {
        return;
      }


      lista.innerHTML =
        "Carregando refeições...";


      google.script.run

        .withSuccessHandler(
          function(produtos) {

            if (
              !produtos ||
              produtos.length === 0
            ) {

              lista.innerHTML =
                "<p>Nenhuma refeição cadastrada.</p>";

              return;
            }


            var html =
              "<table>" +

              "<thead>" +

              "<tr>" +

              "<th>Refeição</th>" +

              "<th>Descrição</th>" +

              "<th>Status</th>" +

              "<th>Ações</th>" +

              "</tr>" +

              "</thead>" +

              "<tbody>";


            produtos.forEach(
              function(produto) {

                html +=

                  "<tr>" +

                  "<td>" +
                  escaparHTML(
                    produto.nome
                  ) +
                  "</td>" +

                  "<td>" +
                  escaparHTML(
                    produto.descricao
                  ) +
                  "</td>" +

                  "<td>" +
                  escaparHTML(
                    produto.ativo
                  ) +
                  "</td>" +

                  "<td>" +

                  "<button " +
                  "class='btn-small' " +
                  "onclick=\"editarProduto('" +
                  escaparAtributo(
                    produto.id_produto
                  ) +
                  "')\">" +
                  "Editar" +
                  "</button> " +

                  "<button " +
                  "class='btn-danger btn-small' " +
                  "onclick=\"excluirProduto('" +
                  escaparAtributo(
                    produto.id_produto
                  ) +
                  "')\">" +
                  "Excluir" +
                  "</button>" +

                  "</td>" +

                  "</tr>";
              }
            );


            html +=
              "</tbody>" +
              "</table>";


            lista.innerHTML =
              html;
          }
        )

        .withFailureHandler(
          function(erro) {

            tratarErroSessao(
              erro,
              lista,
              "Erro ao carregar refeições."
            );
          }
        )

        .listarProdutos(
          token
        );
    }


    /**
     * ========================================================
     * CARREGAR SELECT DE REFEIÇÕES DO CALENDÁRIO
     * ========================================================
     */
    function carregarRefeicoesCalendario() {

      var select =
        document.getElementById(
          "refeicaoCalendario"
        );


      var token =
        obterTokenGestao();


      if (
        !token ||
        !select
      ) {

        return;
      }


      select.innerHTML =
        "<option value=''>" +
        "Carregando refeições..." +
        "</option>";


      google.script.run

        .withSuccessHandler(
          function(refeicoes) {

            select.innerHTML =
              "<option value=''>" +
              "Selecione a refeição" +
              "</option>";


            if (
              !refeicoes ||
              refeicoes.length === 0
            ) {

              select.innerHTML +=
                "<option value=''>" +
                "Nenhuma refeição cadastrada" +
                "</option>";

              return;
            }


            refeicoes.forEach(
              function(refeicao) {

                if (
                  !refeicao ||
                  !refeicao.id_produto
                ) {

                  return;
                }


                var option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  refeicao.id_produto;


                option.textContent =
                  refeicao.nome ||
                  "";


                select.appendChild(
                  option
                );
              }
            );
          }
        )

        .withFailureHandler(
          function(erro) {

            select.innerHTML =
              "<option value=''>" +
              "Erro ao carregar refeições" +
              "</option>";

            console.error(
              erro
            );
          }
        )

        .listarProdutosAtivos(
          token
        );
    }


    /**
     * ========================================================
     * SALVAR REFEIÇÃO
     * ========================================================
     */
    function salvarProduto() {

      var id =
        document
          .getElementById(
            "idProduto"
          )
          .value
          .trim();


      var nome =
        document
          .getElementById(
            "nomeProduto"
          )
          .value
          .trim();


      var descricao =
        document
          .getElementById(
            "descricaoProduto"
          )
          .value
          .trim();


      var mensagem =
        document.getElementById(
          "mensagemProduto"
        );


      var token =
        obterTokenGestao();


      if (!token) {
        return;
      }


      if (!nome) {

        mensagem.textContent =
          "Digite o nome da refeição.";

        return;
      }


      mensagem.textContent =
        "Salvando...";


      if (id) {

        atualizarProduto(
          id,
          nome,
          descricao
        );

        return;
      }


      google.script.run

        .withSuccessHandler(
          function(resultado) {

            mensagem.textContent =
              (
                resultado &&
                resultado.mensagem
              ) ||
              "Refeição cadastrada com sucesso.";


            limparFormularioProduto();

            carregarProdutos();

            carregarRefeicoesCalendario();
          }
        )

        .withFailureHandler(
          function(erro) {

            tratarErroSessao(
              erro,
              mensagem,
              "Erro ao cadastrar refeição."
            );
          }
        )

        .cadastrarProduto(
          token,
          {
            nome:
              nome,

            descricao:
              descricao
          }
        );
    }


    /**
     * ========================================================
     * ATUALIZAR REFEIÇÃO
     * ========================================================
     */
    function atualizarProduto(
      id,
      nome,
      descricao
    ) {

      var mensagem =
        document.getElementById(
          "mensagemProduto"
        );


      var token =
        obterTokenGestao();


      if (!token) {
        return;
      }


      mensagem.textContent =
        "Atualizando...";


      google.script.run

        .withSuccessHandler(
          function(resultado) {

            mensagem.textContent =
              (
                resultado &&
                resultado.mensagem
              ) ||
              "Refeição atualizada com sucesso.";


            limparFormularioProduto();

            carregarProdutos();

            carregarRefeicoesCalendario();
          }
        )

        .withFailureHandler(
          function(erro) {

            tratarErroSessao(
              erro,
              mensagem,
              "Erro ao atualizar refeição."
            );
          }
        )

        .atualizarProduto(
          token,
          id,
          {
            nome:
              nome,

            descricao:
              descricao,

            ativo:
              "SIM"
          }
        );
    }


    /**
     * ========================================================
     * EDITAR REFEIÇÃO
     * ========================================================
     */
    function editarProduto(
      idProduto
    ) {

      var token =
        obterTokenGestao();


      if (!token) {
        return;
      }


      google.script.run

        .withSuccessHandler(
          function(produto) {

            if (!produto) {

              alert(
                "Refeição não encontrada."
              );

              return;
            }


            document
              .getElementById(
                "idProduto"
              )
              .value =
                produto.id_produto ||
                "";


            document
              .getElementById(
                "nomeProduto"
              )
              .value =
                produto.nome ||
                "";


            document
              .getElementById(
                "descricaoProduto"
              )
              .value =
                produto.descricao ||
                "";


            document
              .getElementById(
                "mensagemProduto"
              )
              .textContent =
                "Editando refeição.";
          }
        )

        .withFailureHandler(
          function(erro) {

            tratarErroSessao(
              erro,
              null,
              "Erro ao buscar refeição."
            );
          }
        )

        .buscarProdutoPorId(
          token,
          idProduto
        );
    }


    /**
     * ========================================================
     * EXCLUIR REFEIÇÃO
     * ========================================================
     */
    function excluirProduto(
      idProduto
    ) {

      if (
        !window.confirm(
          "Deseja realmente excluir esta refeição?"
        )
      ) {

        return;
      }


      var token =
        obterTokenGestao();


      if (!token) {
        return;
      }


      google.script.run

        .withSuccessHandler(
          function(resultado) {

            alert(
              (
                resultado &&
                resultado.mensagem
              ) ||
              "Refeição excluída."
            );


            limparFormularioProduto();

            carregarProdutos();

            carregarRefeicoesCalendario();
          }
        )

        .withFailureHandler(
          function(erro) {

            tratarErroSessao(
              erro,
              null,
              "Erro ao excluir refeição."
            );
          }
        )

        .excluirProduto(
          token,
          idProduto
        );
    }


    /**
     * ========================================================
     * LIMPAR FORMULÁRIO DE REFEIÇÃO
     * ========================================================
     */
    function limparFormularioProduto() {

      document
        .getElementById(
          "idProduto"
        )
        .value =
        "";


      document
        .getElementById(
          "nomeProduto"
        )
        .value =
        "";


      document
        .getElementById(
          "descricaoProduto"
        )
        .value =
        "";


      document
        .getElementById(
          "mensagemProduto"
        )
        .textContent =
        "";
    }


    /**
     * ========================================================
     * SALVAR CARDÁPIO
     * ========================================================
     */
    function salvarCalendario() {

      var token =
        obterTokenGestao();


      if (!token) {
        return;
      }


      var data =
        document
          .getElementById(
            "dataCalendario"
          )
          .value;


      var abrangencia =
        document
          .getElementById(
            "abrangenciaCalendario"
          )
          .value;


      var idRefeicao =
        document
          .getElementById(
            "refeicaoCalendario"
          )
          .value
          .trim();


      var periodo =
        document
          .getElementById(
            "periodoCalendario"
          )
          .value;


      var cardapio =
        document
          .getElementById(
            "cardapioCalendario"
          )
          .value
          .trim();


      var observacao =
        document
          .getElementById(
            "observacaoCalendario"
          )
          .value
          .trim();


      var mensagem =
        document.getElementById(
          "mensagemCalendario"
        );


      /*
       * ======================================================
       * VALIDA DATA
       * ======================================================
       */
      if (!data) {

        mensagem.textContent =
          "Informe a data.";

        return;
      }


      /*
       * ======================================================
       * VALIDA ABRANGÊNCIA
       * ======================================================
       */
      if (
        [
          "DIA",
          "SEMANA",
          "MES"
        ].indexOf(
          abrangencia
        ) === -1
      ) {

        mensagem.textContent =
          "Selecione Dia, Semana ou Mês.";

        return;
      }


      /*
       * ======================================================
       * VALIDA REFEIÇÃO
       * ======================================================
       */
      if (!idRefeicao) {

        mensagem.textContent =
          "Selecione a refeição.";

        return;
      }


      /*
       * ======================================================
       * VALIDA HORÁRIO
       * ======================================================
       */
      if (
        [
          "15:55",
          "18:45"
        ].indexOf(
          periodo
        ) === -1
      ) {

        mensagem.textContent =
          "Selecione o horário 15:55 ou 18:45.";

        return;
      }


      /*
       * ======================================================
       * VALIDA CARDÁPIO
       * ======================================================
       */
      if (!cardapio) {

        mensagem.textContent =
          "Informe o cardápio.";

        return;
      }


      mensagem.textContent =
        "Adicionando ao calendário...";


      google.script.run

        .withSuccessHandler(
          function(resultado) {

            mensagem.textContent =
              (
                resultado &&
                resultado.mensagem
              ) ||
              "Cardápio adicionado ao calendário.";


            limparFormularioCalendario();

            carregarRefeicoesCalendario();

            carregarCalendario();
          }
        )

        .withFailureHandler(
          function(erro) {

            tratarErroSessao(
              erro,
              mensagem,
              "Erro ao adicionar cardápio."
            );
          }
        )

        .cadastrarCalendario(
          token,
          {

            data:
              data,

            abrangencia:
              abrangencia,

            id_refeicao:
              idRefeicao,

            periodo:
              periodo,

            cardapio:
              cardapio,

            observacao:
              observacao
          }
        );
    }


    /**
     * ========================================================
     * LIMPAR FORMULÁRIO DO CALENDÁRIO
     * ========================================================
     */
    function limparFormularioCalendario() {

      document
        .getElementById(
          "dataCalendario"
        )
        .value =
        "";


      document
        .getElementById(
          "abrangenciaCalendario"
        )
        .value =
        "DIA";


      document
        .getElementById(
          "refeicaoCalendario"
        )
        .value =
        "";


      document
        .getElementById(
          "periodoCalendario"
        )
        .value =
        "";


      document
        .getElementById(
          "cardapioCalendario"
        )
        .value =
        "";


      document
        .getElementById(
          "observacaoCalendario"
        )
        .value =
        "";


      document
        .getElementById(
          "mensagemCalendario"
        )
        .textContent =
        "";
    }


    /**
     * ========================================================
     * CARREGAR CALENDÁRIO
     * ========================================================
     */
    function carregarCalendario() {

      var lista =
        document.getElementById(
          "listaCalendario"
        );


      var token =
        obterTokenGestao();


      if (!token) {
        return;
      }


      lista.innerHTML =
        "Carregando calendário...";


      google.script.run

        .withSuccessHandler(
          function(calendario) {

            if (
              !calendario ||
              calendario.length === 0
            ) {

              lista.innerHTML =
                "<p>Nenhum registro no calendário.</p>";

              return;
            }


            var html =
              "<table>" +

              "<thead>" +

              "<tr>" +

              "<th>Data</th>" +

              "<th>Horário</th>" +

              "<th>Refeição</th>" +

              "<th>Cardápio</th>" +

              "<th>Observação</th>" +

              "<th>Ação</th>" +

              "</tr>" +

              "</thead>" +

              "<tbody>";


            calendario.forEach(
              function(item) {

                html +=

                  "<tr>" +

                  "<td>" +

                  escaparHTML(
                    formatarData(
                      item.data
                    )
                  ) +

                  "</td>" +

                  "<td>" +

                  escaparHTML(
                    item.periodo ||
                    ""
                  ) +

                  "</td>" +

                  "<td>" +

                  escaparHTML(
                    item.refeicao ||
                    ""
                  ) +

                  "</td>" +

                  "<td>" +

                  escaparHTML(
                    item.cardapio ||
                    ""
                  )
                  .replace(
                    /\n/g,
                    "<br>"
                  ) +

                  "</td>" +

                  "<td>" +

                  escaparHTML(
                    item.observacao ||
                    ""
                  ) +

                  "</td>" +

                  "<td>" +

                  "<button " +

                  "class='btn-danger btn-small' " +

                  "onclick=\"excluirCalendario('" +

                  escaparAtributo(
                    item.id_calendario
                  ) +

                  "')\">" +

                  "Excluir" +

                  "</button>" +

                  "</td>" +

                  "</tr>";
              }
            );


            html +=
              "</tbody>" +
              "</table>";


            lista.innerHTML =
              html;
          }
        )

        .withFailureHandler(
          function(erro) {

            tratarErroSessao(
              erro,
              lista,
              "Erro ao carregar calendário."
            );
          }
        )

        .listarCalendario(
          token
        );
    }


    /**
     * ========================================================
     * EXCLUIR ITEM DO CALENDÁRIO
     * ========================================================
     */
    function excluirCalendario(
      idCalendario
    ) {

      if (
        !window.confirm(
          "Deseja excluir este registro do calendário?"
        )
      ) {

        return;
      }


      var token =
        obterTokenGestao();


      if (!token) {
        return;
      }


      google.script.run

        .withSuccessHandler(
          function(resultado) {

            alert(
              (
                resultado &&
                resultado.mensagem
              ) ||
              "Registro excluído com sucesso."
            );


            carregarCalendario();
          }
        )

        .withFailureHandler(
          function(erro) {

            tratarErroSessao(
              erro,
              null,
              "Erro ao excluir calendário."
            );
          }
        )

        .excluirCalendario(
          token,
          idCalendario
        );
    }


    /**
     * ========================================================
     * SAIR
     * ========================================================
     */
    function sairGestao() {

      var token =
        String(
          sessionStorage.getItem(
            "token"
          ) || ""
        ).trim();


      sessionStorage.clear();


      if (!token) {

        carregarPagina(
          "Index"
        );

        return;
      }


      google.script.run

        .withSuccessHandler(
          function() {

            carregarPagina(
              "Index"
            );
          }
        )

        .withFailureHandler(
          function() {

            carregarPagina(
              "Index"
            );
          }
        )

        .logout(
          token
        );
    }


    /**
     * ========================================================
     * ENCERRAR SESSÃO LOCAL
     * ========================================================
     */
    function encerrarSessaoLocal() {

      sessionStorage.clear();

      carregarPagina(
        "Index"
      );
    }


    /**
     * ========================================================
     * TRATAR ERRO DE SESSÃO
     * ========================================================
     */
    function tratarErroSessao(
      erro,
      elemento,
      mensagemPadrao
    ) {

      var mensagem =
        (
          erro &&
          erro.message
        ) || "";


      if (
        mensagem.indexOf(
          "Token não informado"
        ) !== -1 ||

        mensagem.indexOf(
          "Sessão inválida"
        ) !== -1 ||

        mensagem.indexOf(
          "Sessão expirada"
        ) !== -1
      ) {

        sessionStorage.clear();


        alert(
          "Sua sessão terminou. Faça login novamente."
        );


        carregarPagina(
          "Index"
        );


        return;
      }


      if (elemento) {

        elemento.innerHTML =
          "<p class='error-message'>" +

          escaparHTML(
            mensagem ||
            mensagemPadrao
          ) +

          "</p>";

      } else {

        alert(
          mensagem ||
          mensagemPadrao
        );
      }
    }


    /**
     * ========================================================
     * CARREGAR PÁGINA
     * ========================================================
     */
    function carregarPagina(
      nomeArquivo
    ) {

      google.script.run

        .withSuccessHandler(
          function(html) {

            if (!html) {

              alert(
                "Página não encontrada."
              );

              return;
            }


            document.open();

            document.write(
              html
            );

            document.close();
          }
        )

        .withFailureHandler(
          function(erro) {

            alert(
              (
                erro &&
                erro.message
              ) ||
              "Erro ao abrir a página."
            );
          }
        )

        .include(
          nomeArquivo
        );
    }


    /**
     * ========================================================
     * FORMATAR DATA
     * ========================================================
     */
    function formatarData(
      data
    ) {

      if (!data) {
        return "";
      }


      var texto =
        String(
          data
        );


      if (
        texto.indexOf(
          "T"
        ) !== -1
      ) {

        return texto
          .split("T")[0]
          .split("-")
          .reverse()
          .join("/");
      }


      return texto;
    }


    /**
     * ========================================================
     * ESCAPAR HTML
     * ========================================================
     */
    function escaparHTML(
      texto
    ) {

      var div =
        document.createElement(
          "div"
        );


      div.textContent =
        texto === undefined ||
        texto === null
          ? ""
          : String(texto);


      return div.innerHTML;
    }


    /**
     * ========================================================
     * ESCAPAR ATRIBUTO
     * ========================================================
     */
    function escaparAtributo(
      texto
    ) {

      return String(
        texto === undefined ||
        texto === null
          ? ""
          : texto
      )
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      );
    }


    inicializarGestao();

  </script>

</body>

</html>
