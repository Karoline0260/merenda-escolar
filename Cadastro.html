<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <?!= include("CSS"); ?>

</head>

<body>

<div class="container">

  <div class="card login-card">

    <div class="logo">
      📝
    </div>

    <h2>
      Criar cadastro
    </h2>

    <p class="subtitle">
      Cadastre-se para consultar o calendário da merenda.
    </p>

    <input
      id="nomeCadastro"
      type="text"
      placeholder="Nome completo"
    >

    <input
      id="emailCadastro"
      type="email"
      placeholder="E-mail"
    >

    <input
      id="senhaCadastro"
      type="password"
      placeholder="Senha"
    >

    <button
      class="btn-primary"
      id="btnCadastro"
      onclick="cadastrar()"
    >
      Criar cadastro
    </button>

    <button
      class="btn-back"
      onclick="carregarPagina('LoginAluno')"
    >
      Voltar para o login
    </button>

    <p
      id="mensagemCadastro"
      class="feedback"
    ></p>

  </div>

</div>

<script>

function cadastrar() {

  var nome =
    document
      .getElementById(
        "nomeCadastro"
      )
      .value
      .trim();

  var email =
    document
      .getElementById(
        "emailCadastro"
      )
      .value
      .trim()
      .toLowerCase();

  var senha =
    document
      .getElementById(
        "senhaCadastro"
      )
      .value;

  var mensagem =
    document.getElementById(
      "mensagemCadastro"
    );

  var botao =
    document.getElementById(
      "btnCadastro"
    );

  if (!nome) {

    mensagem.textContent =
      "Digite o nome completo.";

    return;
  }

  if (!email) {

    mensagem.textContent =
      "Digite o e-mail.";

    return;
  }

  if (senha.length < 6) {

    mensagem.textContent =
      "A senha deve ter pelo menos 6 caracteres.";

    return;
  }

  botao.disabled =
    true;

  mensagem.textContent =
    "Criando cadastro...";

  google.script.run

    .withSuccessHandler(
      function(resultado) {

        mensagem.textContent =
          resultado &&
          resultado.mensagem
            ? resultado.mensagem
            : "Cadastro criado com sucesso.";

        botao.disabled =
          false;

        document
          .getElementById(
            "nomeCadastro"
          )
          .value = "";

        document
          .getElementById(
            "emailCadastro"
          )
          .value = "";

        document
          .getElementById(
            "senhaCadastro"
          )
          .value = "";
      }
    )

    .withFailureHandler(
      function(erro) {

        mensagem.textContent =
          erro &&
          erro.message
            ? erro.message
            : "Não foi possível criar o cadastro.";

        botao.disabled =
          false;
      }
    )

    .cadastrarUsuario(
      {
        nome:
          nome,

        email:
          email,

        senha:
          senha,

        perfil:
          "ALUNO"
      }
    );
}


function carregarPagina(
  nomeArquivo
) {

  google.script.run

    .withSuccessHandler(
      function(html) {

        document.open();

        document.write(
          html
        );

        document.close();
      }
    )

    .include(
      nomeArquivo
    );
}

</script>

</body>
</html>
